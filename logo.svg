<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base 3D Stacked Pages -->
  <rect x="22" y="24" width="60" height="74" rx="8" fill="#e2e8f0" transform="translate(-4, 4)"/>
  <rect x="22" y="24" width="60" height="74" rx="8" fill="#f8fafc" transform="translate(-2, 2)"/>

  <!-- Main Document Sheet -->
  <g filter="url(#softShadow)">
    <path d="M 24 20 L 64 20 L 78 34 L 78 92 C 78 96 74 100 70 100 L 24 100 C 20 100 16 96 16 92 L 16 28 C 16 24 20 20 24 20 Z" fill="url(#docGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Folded Corner -->
    <path d="M 64 20 L 64 34 L 78 34 Z" fill="url(#foldGrad)"/>
    
    <!-- Text Lines -->
    <line x1="28" y1="36" x2="54" y2="36" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="28" y1="46" x2="66" y2="46" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="54" x2="66" y2="54" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="62" x2="48" y2="62" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="70" x2="44" y2="70" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Magnifying Glass with Minus Sign (Summary Distillation Icon) -->
  <g filter="url(#glassShadow)">
    <!-- Lens Body -->
    <circle cx="68" cy="68" r="22" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="4"/>
    <circle cx="68" cy="68" r="17" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.4"/>
    
    <!-- Minus (-) Sign -->
    <line x1="58" y1="68" x2="78" y2="68" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Handle -->
    <path d="M 83 83 L 98 98" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <path d="M 83 83 L 98 98" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
